<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="theme-color" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover"
		/>
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="preconnect" href="https://bsky.social" />
		<style>
			/* minimum styles needed before the application loads */
			html,
			body {
				margin: 0px;
				padding: 0px;
				font-family:
					'Inter Variable',
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					Roboto,
					'Liberation Sans',
					Helvetica,
					Arial,
					sans-serif;
				text-rendering: optimizeLegibility;
				/* platform reset */
				-webkit-overflow-scrolling: touch;
				-webkit-text-size-adjust: 100%;
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
				-ms-overflow-style: scrollbar;
				font-synthesis-weight: none;
			}

			html,
			body,
			#root {
				display: flex;
				flex: 1 0 auto;
				flex-direction: column;
				min-height: 100%;
				width: 100%;
			}

			:root {
				--text: black;
				--background: white;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					color-scheme: dark;
					--text: white;
					--background: black;
				}
			}

			.theme--light {
				background-color: white;
				--text: black;
				--background: white;
			}
			.theme--dark {
				color-scheme: dark;
				background-color: black;
				--text: white;
				--background: black;
			}
			.theme--dim {
				color-scheme: dark;
				background-color: #151d28;
				--text: white;
				--background: #151d28;
			}

			#splash {
				display: flex;
				position: fixed;
				top: 0;
				bottom: 0;
				left: 0;
				right: 0;
				align-items: center;
				justify-content: center;
			}
			#splash svg {
				position: relative;
				top: -50px;
				width: 100px;
			}
			/* keep scrollbar appearance from shifting the page */
			body {
				width: 100%;
				overflow-y: scroll;
			}
		</style>
		<script>
			const theme = localStorage.getItem('ALF_THEME');
			if (theme) {
				document.documentElement.classList.add(`theme--${theme}`);
			}
		</script>
	</head>

	<body>
		<noscript>
			<form
				action=""
				style="background-color: #fff; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9999"
			>
				<div
					style="
						font-size: 18px;
						font-family: Helvetica, sans-serif;
						line-height: 24px;
						margin: 10%;
						width: 80%;
					"
				>
					<p lang="en">Oh no! It looks like JavaScript is not enabled in your browser.</p>
					<p lang="en" style="margin: 20px 0">
						<button
							type="submit"
							style="
								background-color: #4630eb;
								border-radius: 100px;
								border: none;
								box-shadow: none;
								color: #fff;
								cursor: pointer;
								font-weight: bold;
								line-height: 20px;
								padding: 6px 16px;
							"
						>
							Reload
						</button>
					</p>
				</div>
			</form>
		</noscript>

		<div id="splash">
			<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 57">
				<path
					fill="#006AFF"
					d="M13.873 3.805C21.21 9.332 29.103 20.537 32 26.55v15.882c0-.338-.13.044-.41.867-1.512 4.456-7.418 21.847-20.923 7.944-7.111-7.32-3.819-14.64 9.125-16.85-7.405 1.264-15.73-.825-18.014-9.015C1.12 23.022 0 8.51 0 6.55 0-3.268 8.579-.182 13.873 3.805ZM50.127 3.805C42.79 9.332 34.897 20.537 32 26.55v15.882c0-.338.13.044.41.867 1.512 4.456 7.418 21.847 20.923 7.944 7.111-7.32 3.819-14.64-9.125-16.85 7.405 1.264 15.73-.825 18.014-9.015C62.88 23.022 64 8.51 64 6.55c0-9.818-8.578-6.732-13.873-2.745Z"
				/>
			</svg>
		</div>
		<div id="root"></div>
	</body>
</html>
